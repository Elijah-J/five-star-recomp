# Builds the solution and runs the tests. CI has no game files: tests that read a dump skip and say why.
# Windows runs everything else, including the shader translator tests on D3D12 WARP; Linux runs what is not Windows-only.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      # The official LLVM build that ships llvm-mc and llvm-objdump with the AMDGPU target; only those two are kept.
      LLVM_VERSION: 18.1.8
      LLVM_SHA256: 22c5907db053026cc2a8ff96d21c0f642a90d24d66c23c6d28ee7b1d572b82e8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache LLVM tools
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm
          key: llvm-${{ env.LLVM_VERSION }}-mc-objdump

      - name: Download LLVM tools
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        env:
          LLVM_DIR: ${{ runner.temp }}/llvm
        run: |
          $name = "clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc"
          $archive = Join-Path $env:RUNNER_TEMP 'llvm.tar.xz'
          Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/$name.tar.xz" -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash

          if ($hash -ne $env:LLVM_SHA256) {
            throw "LLVM archive hash $hash does not match $env:LLVM_SHA256"
          }

          New-Item -ItemType Directory -Force $env:LLVM_DIR | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf $archive -C $env:LLVM_DIR --strip-components=2 "$name/bin/llvm-mc.exe" "$name/bin/llvm-objdump.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "tar failed with exit code $LASTEXITCODE"
          }

          Remove-Item $archive

      - name: Locate shader toolchain
        env:
          LLVM_DIR: ${{ runner.temp }}/llvm
        run: |
          Add-Content $env:GITHUB_ENV "FIVESTAR_LLVM=$env:LLVM_DIR"
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $dxc = Get-ChildItem $kits -Directory -Filter '10.*' |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\dxc.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if ($dxc) {
            Add-Content $env:GITHUB_ENV "FIVESTAR_DXC=$dxc"
          }

          Write-Output "Windows: $([Environment]::OSVersion.Version)"
          Write-Output "dxc: $dxc"
          Write-Output "WARP: $(Test-Path "$env:SystemRoot\System32\d3d10warp.dll")"
          $version = & "$env:LLVM_DIR\llvm-mc.exe" --version
          Write-Output "llvm-mc: $($version[1].Trim())"

      - name: Restore
        run: dotnet restore FiveStar.slnx

      - name: Build
        run: dotnet build FiveStar.slnx --no-restore

      - name: Architecture rules
        run: dotnet test tests/FiveStar.Architecture.Tests --no-build

      - name: Test
        run: dotnet test FiveStar.slnx --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults
          if-no-files-found: ignore

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore FiveStar.slnx

      - name: Build
        run: dotnet build FiveStar.slnx --no-restore

      # The loader maps Windows images through kernel32, so its tests are Windows-only.
      # The D3D12 tests in FiveStar.Shaders.Tests skip on their own outside Windows.
      - name: Test
        run: |
          for project in Architecture Formats Shaders Cli; do
            dotnet test "tests/FiveStar.$project.Tests" --no-build --logger trx --results-directory TestResults
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: TestResults
          if-no-files-found: ignore
